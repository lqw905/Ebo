name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/ebo

      - name: CLI smoke
        run: go test ./internal/cli -run TestCLISmoke -count=1

  npm:
    name: npm metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check package metadata
        run: node scripts/check-npm-packages.mjs

      - name: Pack root package dry-run
        run: npm pack --dry-run ./npm/root

      - name: Prepare npm package smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf fake > dist/ebo-windows-amd64.exe
          printf fake > dist/ebo-darwin-arm64
          node scripts/prepare-npm-packages.mjs 0.1.999 dist
          node scripts/check-npm-packages.mjs
          npm pack --dry-run ./npm/platforms/win32-x64
          npm pack --dry-run ./npm/platforms/darwin-arm64
