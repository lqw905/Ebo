name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          npm-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Test
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/lqw905/Ebo/internal/cli.Version=${version} -X github.com/lqw905/Ebo/internal/cli.Commit=${GITHUB_SHA} -X github.com/lqw905/Ebo/internal/cli.BuiltAt=${built_at}"
          mkdir -p dist

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${ldflags}" -o dist/ebo-windows-amd64.exe ./cmd/ebo
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "${ldflags}" -o dist/ebo-darwin-arm64 ./cmd/ebo

          (cd dist && sha256sum * > checksums.txt)

      - name: Prepare npm packages
        run: node scripts/prepare-npm-packages.mjs "${GITHUB_REF_NAME#v}" dist

      - name: Check npm metadata
        run: node scripts/check-npm-packages.mjs

      - name: npm pack dry-run
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run ./npm/platforms/win32-x64
          npm pack --dry-run ./npm/platforms/darwin-arm64
          npm pack --dry-run ./npm/root

      - name: Publish platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          npm publish ./npm/platforms/win32-x64 --access public --provenance
          npm publish ./npm/platforms/darwin-arm64 --access public --provenance

      - name: Verify platform packages are visible
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm view "@aibo666/ebo-win32-x64@${version}" version
          npm view "@aibo666/ebo-darwin-arm64@${version}" version

      - name: Publish root npm package
        run: npm publish ./npm/root --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
